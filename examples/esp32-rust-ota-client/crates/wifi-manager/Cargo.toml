[package]
name = "wifi-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29"
esp-idf-svc = "0.52.1"
firmware-app-api = { path = "../application-api" }
log = "0.4"
