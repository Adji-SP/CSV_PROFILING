# Include inside an existing HTTPS server block; configure certificates separately.
# Serve web/ from that server's root. Axum should use OTA_CONSOLE_ONLY=true.
# Do not forward other /api/ota routes from the public Internet.
location /api/ota/console/ {
    proxy_pass http://127.0.0.1:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
location /api/ota/ {
    return 404;
}
